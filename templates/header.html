{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{% static 'header.css' %}">



<nav class="navbar navbar-dark bg-dark shadow py-2">

    <div class="container-fluid navbar-container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <i class="fa-solid fa-bag-shopping text-warning"></i>
            FashionHub
        </a>


        <!-- Left Menu -->
        <ul class="navbar-nav flex-row left-menu">

            <!-- Home -->
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}"
                   href="{% url 'home' %}">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>


            <!-- Products -->
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/products/' %}active{% endif %}"
                   href="{% url 'products' %}">
                    <i class="fa-solid fa-shirt"></i>
                    Products
                </a>
            </li>


            <!-- Details -->
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/products-details/' %}active{% endif %}"
                   href="{% url 'products_details' %}">
                    <i class="fa-solid fa-circle-info"></i>
                    Details
                </a>
            </li>

        </ul>


        <!-- Search -->
        <form class="search-form">

            <input class="form-control"
                   type="search"
                   placeholder="Search for products...">

            <button class="btn btn-warning"
                    type="submit">

                <i class="fa-solid fa-search"></i>

            </button>

        </form>


        <!-- Right Menu -->
        <ul class="navbar-nav flex-row right-menu">

            <!-- Cart -->
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/cart/' %}active{% endif %}"
                   href="{% url 'cart' %}">

                    <span class="badge bg-warning text-dark rounded-pill">
                        0
                    </span>

                    <i class="fa-solid fa-cart-shopping"></i>
                    Cart

                </a>
            </li>


            <!-- Order -->
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/order/' %}active{% endif %}"
                   href="{% url 'order' %}">

                    <i class="fa-solid fa-credit-card"></i>
                    Order

                </a>
            </li>

        </ul>
        <!-- Profile -->
<div class="dropdown">

    <!-- Profile Icon -->
    <button class="btn btn-link text-white"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">

        <i class="fa-solid fa-user fa-lg"></i>

    </button>

    <!-- Dropdown Menu -->
    <ul class="dropdown-menu dropdown-menu-end">

        <li>
            <a class="dropdown-item" href="{% url 'profile' %}">
                <i class="fa-solid fa-user me-2"></i>
                Profile
            </a>
        </li>

        <li>
            <a class="dropdown-item text-bold-black"
               href="{% url 'home' %}">
                <i class="fa-solid fa-home me-2"></i>
                HOME
            </a>
            <a class="dropdown-item text-bold-black"
               href="{% url 'Account_Business' %}">
               <i class="fa-solid fa-briefcase"></i>
                Account Business
            </a>
            <a class="dropdown-item text-bold-black"
               href="{% url 'cart' %}">
                <i class="fa-solid fa-cart-shopping me-2"></i>
                Cart
            </a>
            <a class="dropdown-item text-bold-black"
               href="{% url 'order' %}">
                <i class="fa-solid fa-box  me-2"></i>Order
            </a>
            <a class="dropdown-item text-danger"
               href="{% url 'logout' %}">
                <i class="fa-solid fa-user-lock me-2"></i>
                login
        </a>
            </a>
            <a class="dropdown-item text-danger"
               href="{% url 'logout' %}">
                <i class="fa-solid fa-right-from-bracket me-2"></i>
                Logout
        </a>
        </li>

    </ul>

</div>

    </div>

</nav>

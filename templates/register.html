{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FashionHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

 

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-4">
                        <i class="fa-solid fa-user-plus text-success"></i>
                        Create Account
                    </h2>

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-user"></i>
                                </span>

                                <input type="text"name="full_name"class="form-control" placeholder="Enter your full name"
                                       required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>

                              <input
                                    type="email" name="email"
                                    class="form-control"placeholder="example@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
                                    title="Please enter a valid Gmail address"
                                    required
                              >
                            </div>
                        </div>

                        <!-- Mobile -->
                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-phone"></i>
                                </span>

                                <input type="tel"
                                       name="mobile"
                                       class="form-control"
                                       placeholder="Enter mobile number"
                                       required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>

                                <input type="password" name="password"
                                       class="form-control"
                                       placeholder="Create password"
                                       required>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>

                                <input type="password"
                                       name="confirm_password"
                                       class="form-control"
                                       placeholder="Confirm password"
                                       required>
                            </div>
                        </div>

                        <!-- Terms -->
                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   name="terms"
                                   id="terms"
                                   required>

                            <label class="form-check-label" for="terms">
                                I agree to the
                                <a href="#">Terms & Conditions</a>
                            </label>

                        </div>

                        <!-- Register Button -->
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fa-solid fa-user-plus"></i>
                            Register
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        Already have an account?

                        <a href="{% url 'login' %}"
                           class="text-decoration-none fw-bold">
                            Login
                        </a>
                    </p>
                    <a href="/accounts/google/login/">
                Login with Google
            </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
